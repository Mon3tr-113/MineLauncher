name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile + build fat jar
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon fatJar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-jar
          path: build/libs/*.jar
          if-no-files-found: error
